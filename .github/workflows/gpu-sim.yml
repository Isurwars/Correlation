name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA calculators and runs the GPU calculator tests on a simulated NVIDIA
# H100 (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: GPU tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libtbb-dev pkg-config libfftw3-dev

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime. nvcc 13.0 has no C++23 dialect, which
      # src/CMakeLists.txt requests for gpu_calculators_obj, so the CI copy
      # of that one line asks for C++20 (the rest of the project is C++20 for
      # CUDA already). nvcc's preprocessor also lacks the C++23 #elifdef, so
      # the CI copy spells it out as #elif defined().
      - name: Configure
        run: |
          sed -i 's/CUDA_STANDARD 23/CUDA_STANDARD 20/' src/CMakeLists.txt
          grep -rlE '^#\s*elifdef' include src | xargs sed -i -E 's/^(#\s*)elifdef\s+(\w+)/\1elif defined(\2)/'
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_CUDA=ON \
            -DBUILD_GUI=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: vgpu run --preload cmake --build build -j3 --target correlation_unit_tests

      # The GPU tests return early when no device is found, so the log must
      # show the simulated platform, the binary must report passed tests, and
      # nothing may be skipped or failed.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          vgpu run build/tests/correlation_unit_tests --gtest_filter='GPU*' 2>&1 | tee gpu-tests.log
          grep -q "virtual GPU platform initialized" gpu-tests.log
          grep -Eq "\[  PASSED  \] [1-9][0-9]* tests?\." gpu-tests.log
          if grep -Eq "FAILED|SKIPPED|CUDA error" gpu-tests.log; then
            echo "::error::a GPU test failed or was skipped"
            exit 1
          fi
