name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Fuzz Testing
    uses: ./.github/workflows/fuzz.yml
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: [fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          include-packaging: "true"

      - name: Configure and build
        uses: ./.github/actions/cmake-build

      - name: Run tests and verifications
        uses: ./.github/actions/run-tests

      - name: Package desktop artifacts
        uses: ./.github/actions/package-desktop

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/correlation-*-Linux.deb
            build/correlation-*-Linux.rpm
            build/correlation-*-Linux.tar.gz
            build/Correlation*.AppImage

  build-windows:
    name: Build Windows
    needs: [fuzz]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          include-packaging: "true"

      - name: Configure and build
        uses: ./.github/actions/cmake-build

      - name: Run tests and verifications
        uses: ./.github/actions/run-tests

      - name: Package desktop artifacts
        uses: ./.github/actions/package-desktop

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: build/correlation-*-win64.exe

  build-macos:
    name: Build macOS
    needs: [fuzz]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Configure and build
        uses: ./.github/actions/cmake-build

      - name: Run tests and verifications
        uses: ./.github/actions/run-tests

      - name: Package desktop artifacts
        uses: ./.github/actions/package-desktop

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: build/correlation-*-macOS.dmg

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set version
        run: |
          # Strip leading 'v' if present
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Update PKGBUILD
        run: |
          sed -i "s/pkgver=.*/pkgver=${{ env.VERSION }}/" packaging/PKGBUILD

      - name: Update Checksums
        run: |
          # Fetch the source tarball to compute checksum
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${{ env.VERSION }}.tar.gz"
          curl -L "$URL" -o source.tar.gz
          SHA256=$(sha256sum source.tar.gz | cut -d ' ' -f 1)
          sed -i "s/sha256sums=.*/sha256sums=('$SHA256')/" packaging/PKGBUILD

      - name: Generate .SRCINFO
        timeout-minutes: 10
        run: |
          # We need an Arch environment to use makepkg --printsrcinfo
          docker run --rm \
            --network host \
            -v "$PWD/packaging:/pkg" \
            archlinux /bin/bash -euo pipefail -c '
              pacman -Sy --noconfirm base-devel 1>&2
              useradd -m builder
              chown -R builder:builder /pkg
              cd /pkg
              su builder -c "makepkg --printsrcinfo" > /pkg/.SRCINFO
            '

      - name: Publish to AUR
        timeout-minutes: 5
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Configure SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking no
          EOF

          # Configure git identity
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          # Clone the AUR package repo and push updated files
          git clone ssh://aur@aur.archlinux.org/correlation.git /tmp/aur-correlation
          cp packaging/PKGBUILD /tmp/aur-correlation/PKGBUILD
          cp packaging/.SRCINFO /tmp/aur-correlation/.SRCINFO
          cd /tmp/aur-correlation
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Release v${{ env.VERSION }}"
          git push

  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    needs: [fuzz]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cibw_archs: "x86_64"
          - os: ubuntu-24.04
            cibw_archs: "aarch64"
          - os: macos-14
            cibw_archs: "arm64"
          - os: windows-2022
            cibw_archs: "AMD64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET="13.3"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    needs: [fuzz]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-macos, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matcorr
    permissions:
      id-token: write
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload Wheels & sdist to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

