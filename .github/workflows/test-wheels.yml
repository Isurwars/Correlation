name: Test Wheels

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/test-wheels.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/test-wheels.yml'
  workflow_dispatch:

concurrency:
  group: test-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-wheels:
    name: Build & Test Wheel (${{ matrix.os }}) (${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "x86_64"
          - os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
          - os: windows-latest
            cibw_archs: "AMD64"
          - os: macos-latest
            cibw_archs: "x86_64 arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cibuildwheel
        uses: actions/cache@v5
        with:
          path: ~/.cache/cibuildwheel
          key: cibw-${{ runner.os }}-${{ matrix.cibw_archs }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cibw-${{ runner.os }}-${{ matrix.cibw_archs }}-

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_CACHE_DIR: "~/.cache/cibuildwheel"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET="13.3"
            CXXFLAGS="-std=c++23"
            CFLAGS="-std=c23"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
