name: Test Wheels

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/test-wheels.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/test-wheels.yml'
  workflow_dispatch:

concurrency:
  group: test-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-wheels:
    name: Build & Test Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cibuildwheel
        uses: actions/cache@v5
        with:
          path: ~/.cache/cibuildwheel
          key: cibw-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: cibw-${{ runner.os }}-

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_CACHE_DIR: "~/.cache/cibuildwheel"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET="13.3"
            CXXFLAGS="-std=c++23"
            CFLAGS="-std=c23"
          CIBW_TEST_REQUIRES: "numpy pytest"
          CIBW_TEST_COMMAND: "python {project}/tests/test_bindings.py"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
