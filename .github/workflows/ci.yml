name: CI Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libtbb-dev libhdf5-dev build-essential cmake pkg-config libfontconfig-dev libfreetype6-dev libexpat1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-0 xvfb libgtk-3-dev libfftw3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja tbb hdf5 llvm@18 fftw

      - name: Set up Rust & Cargo Cache
        uses: ./.github/actions/setup-rust

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA_FLAGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CC="$(brew --prefix llvm@18)/bin/clang"
            export CXX="$(brew --prefix llvm@18)/bin/clang++"
            EXTRA_FLAGS+=("-DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)")
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja \
            "${EXTRA_FLAGS[@]}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_WITH_HDF5=ON \
            -DBUILD_WITH_ARROW=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        shell: bash
        run: |
          cd build
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run ctest --output-on-failure
          elif [ "${{ runner.os }}" = "Windows" ]; then
            ctest -C Release --output-on-failure -E PythonBindings
          else
            ctest --output-on-failure
          fi

  fuzz:
    name: Fuzz Testing
    uses: ./.github/workflows/fuzz.yml
