name: Fuzz Testing

on:
  workflow_call:
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz Testing (Ubuntu, Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev libfuzzer-18-dev ninja-build libtbb-dev libhdf5-dev build-essential cmake pkg-config libfftw3-dev

      - name: Configure CMake
        run: |
          cmake -B build-fuzz -S . -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBUILD_FUZZ_TESTS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_GUI=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Fuzz Targets
        run: cmake --build build-fuzz --config Release --parallel

      - name: Run Fuzz Smoke Tests
        run: cd build-fuzz && ctest -L fuzz --output-on-failure -j$(nproc)
