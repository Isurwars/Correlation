name: "Set up Dependencies"
description: "Installs system packages, toolchains (Rust, sccache, MSVC), and optional packaging tools"

inputs:
  include-packaging:
    description: "Install packaging tools (rpm on Linux, NSIS on Windows)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up sccache
      uses: ./.github/actions/setup-sccache

    - name: Set up Rust & Cargo Cache
      uses: ./.github/actions/setup-rust

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libtbb-dev libhdf5-dev build-essential cmake pkg-config \
          libfontconfig-dev libfreetype6-dev libexpat1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-x11-0 xvfb libgtk-3-dev libfftw3-dev
        if [ "${{ inputs.include-packaging }}" = "true" ]; then
          sudo apt-get install -y rpm
        fi

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ninja tbb hdf5 llvm@18 fftw

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install packaging tools (Windows)
      if: runner.os == 'Windows' && inputs.include-packaging == 'true'
      shell: bash
      run: choco install nsis -y
